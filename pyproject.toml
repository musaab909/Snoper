[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snoper"
dynamic = ["version"]
description = "Transparent voice-activated audio recorder for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Snoper" }]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
encrypt = ["cryptography>=42.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.0"]

[project.scripts]
snoper = "snoper.__main__:main"

[tool.setuptools]
packages = ["snoper", "snoper.audio", "snoper.tray", "snoper.transcribe", "snoper.platform", "snoper.ui", "snoper.storage"]

[tool.setuptools.dynamic]
version = { attr = "snoper.version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# E501 (line length) is enforced by the formatter; ignore long lines in lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use importorskip-before-import (E402) and lambdas (E731) intentionally.
"tests/*" = ["E402", "E731"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Pragmatic for a desktop app: not strict, but catches real type errors.
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["snoper"]
omit = ["snoper/ui/*", "snoper/tray/*"]
