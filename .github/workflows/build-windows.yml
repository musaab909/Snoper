name: Build Windows Installer

# Builds Snoper.exe + Snoper-Setup.exe on a Windows runner.
#   - push to main / manual run -> uploads artifacts (for testing)
#   - push a tag like v1.0.1     -> ALSO publishes a GitHub Release with the
#                                   installer attached. The app's auto-updater
#                                   reads that release to update itself.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write          # needed to create releases

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy snoper          # blocking: core modules are type-clean
      - name: Tests + coverage
        # capture tests skip on headless Linux (no PortAudio); threshold accounts for it.
        run: pytest --cov=snoper --cov-report=term-missing --cov-fail-under=78

  build:
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } else {
            # Inno Setup's VersionInfoVersion must be numeric, so dev builds use 0.0.0.
            $v = '0.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Stamp version into the app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          (Get-Content snoper/version.py) `
            -replace '__version__ = ".*"', "__version__ = ""$v""" `
            | Set-Content snoper/version.py
          Get-Content snoper/version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Snoper.exe (PyInstaller)
        run: pyinstaller --noconfirm --clean build/snoper.spec

      - name: Detect signing certificate
        id: signing
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          # Signing is optional: if the SIGNING_PFX_BASE64 secret isn't set, the
          # build still succeeds (just unsigned). Add the secret to enable signing.
          if ([string]::IsNullOrEmpty($env:PFX_B64)) {
            "enabled=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "No signing cert secret; building unsigned."
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            "enabled=true"   | Out-File $env:GITHUB_OUTPUT -Append
            "pfx=$pfx"       | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "Signing cert loaded."
          }

      - name: Sign Snoper.exe
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "${{ steps.signing.outputs.pfx }}" /p "$env:PFX_PASS" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist\Snoper.exe"

      - name: Smoke-test the exe on real Windows
        shell: pwsh
        run: |
          # Runs the actual frozen exe and fails the build if it can't start
          # (catches packaging/relative-import regressions before release).
          $log = Join-Path $env:TEMP "snoper_selftest.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath "dist\Snoper.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            throw "Snoper.exe --selftest hung (likely a startup-crash dialog)."
          }
          if (Test-Path $log) {
            Write-Host "----- selftest log -----"
            Get-Content $log
            Write-Host "------------------------"
          }
          if ($p.ExitCode -ne 0) {
            throw "Snoper.exe --selftest failed (exit code $($p.ExitCode)). See log above."
          }
          Write-Host "OK: Snoper.exe launched and passed selftest on Windows."

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Snoper-Setup.exe)
        working-directory: build
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          $v = '${{ steps.ver.outputs.version }}'
          Write-Host "Using ISCC at: $iscc (version $v)"
          & $iscc "/DAppVersion=$v" installer.iss

      - name: Sign installer (Snoper-Setup.exe)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "${{ steps.signing.outputs.pfx }}" /p "$env:PFX_PASS" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "build\Output\Snoper-Setup.exe"

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: Snoper-exe
          path: dist/Snoper.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Snoper-Setup
          path: build/Output/Snoper-Setup.exe

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Output/Snoper-Setup.exe
            dist/Snoper.exe
          generate_release_notes: true
